      swaggerPath: configuration/swagger
      apiPath: api
    flyte-admin-web:
      target: service/flyteadmin
      targetPort: 80
      localPort: 8081
      namespace: flyte
      type: other
    archie-backend:
      target: service/archie-backend
      targetPort: 50051
